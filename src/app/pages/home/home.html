

<div class="container">
<mat-toolbar>

  <span>Simple Blog Alessandro</span>
  <span class="spacer"></span>
  <a class="toolbar-link" routerLink="/blog" routerLinkActive="active"> Blog</a>

  @if (auth.isAuthenticated()) {
    <a class="toolbar-link" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
  }


  <span class="itens-spacer"></span>
  <a class="toolbar-login" routerLink="/login">
    @if (!auth.isAuthenticated()) {
      Entrar
    } @else {
      <a class="toolbar-login" (click)="logout()">Sair</a>
    }
  </a>

</mat-toolbar>

<router-outlet></router-outlet>

</div>
