<p>dashboard-post-form-dialog works!</p>

<div class="dialog-container">
    <h2>Nova postagem</h2>

    <mat-dialog-content>

        <form [formGroup]="postForm" (ngSubmit)="onSubmit()">
            <mat-form-field>
                <mat-label>Author</mat-label>
                <input matInput name="author" formControlName="author" >
                <mat-error>Voce deve escrever o nome do author</mat-error>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Titulo</mat-label>
                <input matInput name="title" formControlName="title" >
                <mat-error>Voce deve escrever o nome do Titulo</mat-error>
            </mat-form-field>
           
            <mat-form-field>
                <mat-label>Data</mat-label>
                <input matInput [matDatepicker]="datePicker"  name="date" formControlName="date">
                
                <mat-datepicker-toggle matIconSuffix [for]="datePicker"></mat-datepicker-toggle>
                <mat-datepicker #datePicker></mat-datepicker>
                <mat-error>Voce deve informar a data</mat-error>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Conteudo</mat-label>
                <textarea matInput rows="5" name="content" formControlName="content" ></textarea>
                <mat-error>Voce deve escrever o conteudo</mat-error>
            </mat-form-field>

            <button mat-flat-button [disabled]="!postForm.valid" >Salvar</button>

        </form>
    </mat-dialog-content>

    <mat-dialog-actions>
        <button mat-dialog-close="false">Cancelar</button>
        <button mat-dialog-close="true">Salvar</button>
    </mat-dialog-actions>

</div>
