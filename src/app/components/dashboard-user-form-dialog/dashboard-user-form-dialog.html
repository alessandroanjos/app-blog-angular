<p>dashboard-user-form-dialog works!</p>

<div class="dialog-container">
  <h2>{{ formTitle }}</h2>
  <mat-dialog-content>
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      @if (saveError) {
        <p role="alert">{{ saveError }}</p>
      }
      <mat-form-field>
        <mat-label>Nome</mat-label>
        <input matInput name="name" formControlName="name">
        <mat-error>Você deve escrever o nome do usuário</mat-error>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput name="email" formControlName="email">
        <mat-error>Você deve escrever um endereço de email válido</mat-error>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Senha</mat-label>
        <input matInput type="password" name="password" formControlName="password">
        <mat-error>Você deve definir um senha maior ou igual a 6 caracteres</mat-error>
      </mat-form-field>
      <mat-checkbox matInput name="isActive" formControlName="isActive">
        Ativo
      </mat-checkbox>
      <button mat-flat-button [disabled]="!userForm.valid">
        {{ submitButtonLabel }}
      </button>
    </form>
  </mat-dialog-content>
</div>
